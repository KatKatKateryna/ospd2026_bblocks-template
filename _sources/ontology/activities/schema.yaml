$schema: https://json-schema.org/draft/2020-12/schema
description: A MoM activity is a processing activity of one of the MoM activity types.
allOf:
  - $ref: bblocks://lu.rss-hydro.mom.processing-activity
  - $ref: '#/$defs/isMomActivity'
$defs:
  isMomActivity:
    required: [activityType]
    properties:
      activityType:
        enum: [mom:WatershedCellAttribution, mom:PerWatershedAggregation, mom:HazardScoreAccumulation]
